# render.yaml — Infraestructura como código para Render.com
# Render maneja TLS automáticamente: el cliente conecta por wss:// y Render
# hace TLS termination antes de pasar la conexión al servicio en ws://.

services:
  - type: web
    name: avaya-echo-bot
    runtime: python
    region: ohio           # us-east-1; cambia a "oregon" si prefieres us-west
    plan: free             # cambia a "starter" ($7/mes) para producción sin sleep

    # Python version is controlled by runtime.txt (python-3.11.9)
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    # Render hace health checks HTTP en esta ruta antes de marcar el servicio
    # como "healthy". Nuestra app responde GET y HEAD con 200 OK.
    healthCheckPath: /healthz
